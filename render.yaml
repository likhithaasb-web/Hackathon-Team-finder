services:
  # =======================================================
  # 1. Backend Web Service (Node.js + Socket.IO + Express)
  # =======================================================
  - type: web
    name: hackmate-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # =======================================================
  # 2. Frontend Client (React Vite Single Page Application)
  # =======================================================
  - type: web
    name: hackmate-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://hackmate-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        sync: false # e.g. https://hackmate-api.onrender.com
